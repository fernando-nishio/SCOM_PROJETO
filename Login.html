<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Freevertio - Login</title>
        <link rel="stylesheet" href="convertio_css.css">
    </head>
    <body>
    <header>
        <nav class="barra_nav">
            <div class="logo_site">Freevertio</div>
            <ul class="link_de_nav">
                <li><a href="convertio_piorado.html">Main</a></li>
                <li><a href="Sobre.html">Sobre</a></li>
                <li><a href="Login.html">Login</a></li>
            </ul>
        </nav>
    </header>
    <main>
    <div class="login_conta">
        <h1 class="texto_branco">Insira o seu login</h1>
        <form id="form_login">
            <div class="form_group">
                <label for="userEmail">E-mail:</label>
                <input type="email" id="userEmail" name="email" required>
            </div>
            <div class="form_group">
                <label for="password">Senha:</label>
                <input type="password" id="password" name="password" required>
            </div>

            <span id="mensagem_erro" class="login_erro hidden">
                E-mail ou senha incorretos, por favor tente novamente.
            </span>

            <button type="submit" class="btn_login">Login</button>
        </form>

        <a href="Cria_login.html" class="botao_link">Não possui login? Clique aqui!</a>
    </div>
    </main>
    <footer class="rodape">
        <p>&copy; 2026 Freevertio</p>
        <p><a href="https://www.youtube.com/watch?v=sxcAXamuyR4">Contato</a></p>
        <p><a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ">Redes sociais</a></p>
    </footer>
    <script src="login.js"></script>
    </body>
</html>
